name: Release

# Produit les binaires que le paquet YunoHost telechargera. Les compiler ici
# plutot que sur la machine de l'utilisateur est ce que font tous les paquets
# Rust du catalogue — et ce que notre propre regle BUILD001 recommande.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaires:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Des coureurs natifs plutot qu'une compilation croisee : moins de
          # pieces mobiles, et les binaires sont testes sur leur architecture.
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # On compile dans la distribution visee, pas dans celle du coureur.
    # Les coureurs Ubuntu 24.04 fournissent la glibc 2.39, Debian bookworm la
    # 2.36 : un binaire construit sur le premier refuse de demarrer sur le
    # second. Constate en installant yunopack sur une instance reelle — le
    # binaire echouait sur « GLIBC_2.39 not found ».
    container: debian:bookworm
    steps:
      - name: Outils de compilation
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git
      - uses: actions/checkout@v4
      - name: Chaine Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2

      - name: Compiler
        run: cargo build --release -p yunopack-cli -p yunopack-server

      - name: Verifier la compatibilite glibc
        # Un binaire qui exige une glibc plus recente que celle de bookworm ne
        # demarrerait pas chez l'utilisateur. Mieux vaut echouer ici.
        run: |
          for b in target/release/yunopack target/release/yunopack-server; do
            exige=$(objdump -T "$b" | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1)
            echo "$b exige au plus $exige"
            plus_recent=$(printf '%s\nGLIBC_2.36\n' "$exige" | sort -V | tail -1)
            if [ "$plus_recent" != "GLIBC_2.36" ]; then
              echo "::error::$b exige $exige, au-dela de la glibc 2.36 de bookworm"
              exit 1
            fi
          done

      - name: Empaqueter
        run: |
          apt-get install -y --no-install-recommends binutils
          mkdir -p dist
          cp target/release/yunopack target/release/yunopack-server dist/
          # Les templates et tables sont incorpores au binaire ; seule la
          # documentation de reference accompagne l'archive.
          cp README.md LICENSE dist/
          tar czf "yunopack-linux-${{ matrix.arch }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: yunopack-linux-${{ matrix.arch }}
          path: yunopack-linux-${{ matrix.arch }}.tar.gz

  publier:
    needs: binaires
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Sommes de controle
        run: sha256sum yunopack-linux-*.tar.gz | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            yunopack-linux-*.tar.gz
            SHA256SUMS
          generate_release_notes: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatage
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Garde-fou de l'ADR-002 : aucun client de modele de langage ne doit
      # entrer dans l'arbre de dependances du binaire livre.
      - name: Aucune dependance LLM
        run: |
          if cargo tree --workspace --prefix none 2>/dev/null \
             | grep -Ei '^(async-openai|openai|anthropic|llm-chain|langchain|ollama-rs|genai)\b'; then
            echo "::error::Une dependance vers un client LLM a ete introduite (cf. docs/adr/ADR-002-zero-llm.md)"
            exit 1
          fi
          echo "ok : aucune dependance LLM"

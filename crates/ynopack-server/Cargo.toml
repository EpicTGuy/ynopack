[package]
name = "ynopack-server"
description = "Interface web : coller une URL, suivre le pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ynopack-server"
path = "src/main.rs"

[dependencies]
ynp-core.workspace = true
ynp-analyze.workspace = true
ynp-forge.workspace = true
ynp-rules.workspace = true
ynp-spec.workspace = true
ynp-gen.workspace = true
ynp-verify.workspace = true
axum.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

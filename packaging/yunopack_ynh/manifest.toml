#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
# Genere par yunopack. Les valeurs proviennent de appspec.toml.

packaging_format = 2

id = "yunopack"
name = "Yunopack"
description.en = "Transforme un depot Git en application YunoHost installable : analyse, faisabilite, generation, verification et installation reelle."

version = "0.2.2~ynh1"

# Champ obligatoire selon le schema officiel. Une liste vide est honnete tant
# que personne ne s'est engage a maintenir le paquet.
maintainers = []

[upstream]
license = "AGPL-3.0-only"
code = "https://github.com/EpicTGuy/yunopack"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["arm64", "amd64"]
multi_instance = true
ldap = false
sso = false
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/yunopack"

    [install.init_main_permission]
    type = "group"
    default = "admins"

[resources]

    [resources.sources]

    [resources.sources.main]
    arm64.url = "https://github.com/EpicTGuy/yunopack/releases/download/v0.2.2/yunopack-linux-arm64.tar.gz"
    arm64.sha256 = "001707240115ef649e1598c5786d216f35a9e1a7daab1dfad2ab9e3e30595f68"
    amd64.url = "https://github.com/EpicTGuy/yunopack/releases/download/v0.2.2/yunopack-linux-amd64.tar.gz"
    amd64.sha256 = "4c40c0981c96b4fd503cf5098d61e7c6861a72332a6acf03c8967f5ece94f935"
    in_subdir = false

    autoupdate.strategy = "latest_github_release"
    # Chaine litterale : le motif est une expression reguliere, ses
    # contre-obliques ne doivent pas etre interpretees comme des echappements.
    autoupdate.asset.arm64 = '^yunopack-linux-arm64\.tar\.gz$'
    # Chaine litterale : le motif est une expression reguliere, ses
    # contre-obliques ne doivent pas etre interpretees comme des echappements.
    autoupdate.asset.amd64 = '^yunopack-linux-amd64\.tar\.gz$'

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

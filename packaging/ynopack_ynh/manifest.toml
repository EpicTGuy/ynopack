#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
# Genere par ynopack. Les valeurs proviennent de appspec.toml.

packaging_format = 2

id = "ynopack"
name = "Ynopack"
description.en = "Packager deterministe : d'une URL de depot a une application YunoHost installable. Aucun modele de langage a l'execution."

version = "0.1.0~ynh1"

# Champ obligatoire selon le schema officiel. Une liste vide est honnete tant
# que personne ne s'est engage a maintenir le paquet.
maintainers = []

[upstream]
license = "AGPL-3.0-only"
code = "https://github.com/EpicTGuy/ynopack"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["arm64", "amd64"]
multi_instance = true
ldap = false
sso = false
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/ynopack"

    [install.init_main_permission]
    type = "group"
    default = "admins"

[resources]

    [resources.sources]

    [resources.sources.main]
    arm64.url = "https://github.com/EpicTGuy/ynopack/releases/download/v0.1.0/ynopack-linux-arm64.tar.gz"
    arm64.sha256 = "3ed9a7a87b41be57e8c452ccfabbc0f24be5aa4c75e7ccc3ec6ec4b63fe0e424"
    amd64.url = "https://github.com/EpicTGuy/ynopack/releases/download/v0.1.0/ynopack-linux-amd64.tar.gz"
    amd64.sha256 = "cbf82660ed226279c40b1c04c646ff660bbe5aa04924ef2a5dae5bd9bc10da5c"
    in_subdir = false

    autoupdate.strategy = "latest_github_release"
    # Chaine litterale : le motif est une expression reguliere, ses
    # contre-obliques ne doivent pas etre interpretees comme des echappements.
    autoupdate.asset.arm64 = '^ynopack-linux-arm64\.tar\.gz$'
    # Chaine litterale : le motif est une expression reguliere, ses
    # contre-obliques ne doivent pas etre interpretees comme des echappements.
    autoupdate.asset.amd64 = '^ynopack-linux-amd64\.tar\.gz$'

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
